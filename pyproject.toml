[project]
name = "eval-lift-check"
version = "0.1.0"
description = "Agent skill: decide whether run B really beats run A by pairing eval results item by item (exact McNemar, cluster-robust errors, required N, Holm)."
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "LeeGyeongPil" }]
keywords = ["agent-skill", "evals", "statistics", "mcnemar", "paired-test"]
dependencies = []

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/eval-lift-check"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/eval-lift-check/scripts"]

# Not a distributable package: the skill is the skills/ folder. Keep uv from building one.
[tool.uv]
package = false
